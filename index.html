<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masa</title>
<meta name="description" content="Bir masa kur, linki gönder, arkadaşların gelip otursun. 10 kişilik sesli sohbet masası.">
<meta name="theme-color" content="#07070a">
<meta property="og:title" content="Masa">
<meta property="og:description" content="Bir masa kur. Sesin yeter.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%AF%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app" id="app">
  <div class="lamp"></div><div class="cone"></div><div class="shade"></div>
  <h1 id="title">BİR MASA KUR. SESİN YETER.</h1>
  <div id="sub"></div>
  <div class="table"></div><div class="candle"></div>
  <div id="glasses"></div><div id="chairs"></div><div id="seats"></div>
  <div class="ui" id="ui">
    <div class="link" id="link"></div>
    <button id="mic" class="on">Mikrofon açık</button>
    <button id="copy">Linki kopyala</button>
    <button id="add">Misafir ekle (demo)</button>
    <button id="kick">Misafir kalksın (demo)</button>
    <button id="leave">Masadan kalk</button>
  </div>
  <div class="gate" id="gate">
    <h2 id="gt">Masana otur</h2>
    <p id="gp">Masayı kur, linki arkadaşlarına gönder. Linke tıklayan herkes masaya yürüyüp oturur, sen başköşede kalırsın.</p>
    <input id="nm" placeholder="Adın" maxlength="14" aria-label="Adın">
    <button class="g" id="go">Google ile devam et (demo)</button>
  </div>
</div>
<script src="assets/app.js"></script>
</body>
</html>
