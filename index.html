<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masa</title>
<meta name="description" content="Bir masa kur, linki gönder, arkadaşların gelip otursun. 10 kişilik sesli sohbet masası.">
<meta name="theme-color" content="#07070a">
<meta property="og:title" content="Masa">
<meta property="og:description" content="Bir masa kur. Sesin yeter.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%AF%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070a;--ink:#e9e6df;--dim:#8a8780;--flame:#ff4a2e;--glow:#ffd9a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Space Mono',ui-monospace,Menlo,monospace}
body{display:flex;justify-content:center}
.app{position:relative;width:min(100vw,520px);height:100%;overflow:hidden;container-type:inline-size}
.lamp{position:absolute;left:50%;top:0;width:1px;height:11%;background:#333}
.cone{position:absolute;left:50%;top:10%;width:96cqw;height:96cqw;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,205,140,.22),transparent);pointer-events:none}
.shade{position:absolute;left:50%;top:11%;width:9cqw;height:4cqw;transform:translateX(-50%);background:#2a2a30;border-radius:50% 50% 0 0/100% 100% 0 0;box-shadow:0 1px 10px var(--glow)}
h1{position:absolute;top:3.5%;left:0;right:0;margin:0;text-align:center;font-size:clamp(13px,3.6cqw,17px);letter-spacing:.14em;font-weight:700;padding:0 6cqw;line-height:1.5}
#sub{position:absolute;top:8.5%;left:0;right:0;text-align:center;color:var(--dim);font-size:clamp(11px,3cqw,14px);display:none}
.table{position:absolute;left:50%;top:26%;width:44cqw;height:42%;transform:translateX(-50%);background:linear-gradient(#2a2a32,#121216);clip-path:polygon(34% 0,66% 0,100% 100%,0 100%)}
.candle{position:absolute;left:50%;top:47%;width:2.2cqw;height:5cqw;transform:translate(-50%,-50%);background:var(--flame);border-radius:1px;box-shadow:0 0 22px 8px rgba(255,90,40,.45);animation:fl 1.6s infinite alternate ease-in-out}
@keyframes fl{to{box-shadow:0 0 30px 12px rgba(255,90,40,.6);opacity:.92}}
.glass{position:absolute;width:calc(4.2cqw*var(--k));height:calc(4.6cqw*var(--k));transform:translate(-50%,-50%);border:1px solid #777;border-top-color:#aaa;border-radius:0 0 1cqw 1cqw;background:rgba(255,255,255,.07)}
.glass::after{content:"";position:absolute;left:-40%;right:-40%;bottom:-25%;height:35%;border:1px solid #4a4a52;border-radius:50%}
/* chairs */
.chair{position:absolute;width:11cqw;height:16cqw;--o:0;--dx:0cqw;--dy:0cqw;transform:translate(-50%,-50%) translate(calc(var(--dx)*(1 + var(--o))),calc(var(--dy)*(1 + var(--o)))) scale(var(--k));transition:transform .5s ease}
.chair.out{--o:2}
.chair::before,.chair::after{content:"";position:absolute;border-radius:1cqw}
.chair::before{background:#34343c}.chair::after{background:#202026}
.chair.L{--dx:-2.5cqw}.chair.R{--dx:2.5cqw}
.chair.L::before{left:0;top:0;bottom:0;width:2.6cqw}.chair.L::after{left:3cqw;right:0;top:3cqw;bottom:2cqw}
.chair.R::before{right:0;top:0;bottom:0;width:2.6cqw}.chair.R::after{right:3cqw;left:0;top:3cqw;bottom:2cqw}
.chair.H,.chair.F{width:16cqw;height:11cqw}
.chair.H{--dy:-2.5cqw}.chair.F{--dy:2.5cqw}
.chair.H::before{left:0;right:0;top:0;height:2.6cqw}.chair.H::after{left:3cqw;right:3cqw;top:3cqw;bottom:0}
.chair.F::before{left:0;right:0;bottom:0;height:2.6cqw}.chair.F::after{left:3cqw;right:3cqw;bottom:3cqw;top:0}
/* people */
.p{position:absolute;width:15cqw;height:20cqw;transform:translate(-50%,-50%);transition:left .6s ease,top .6s ease}
.p.walk{transition:left 1.8s linear,top 1.8s linear}
.fig{position:absolute;inset:0;transform:scale(var(--k))}
.head{position:absolute;left:50%;top:0;width:7cqw;height:7cqw;margin-left:-3.5cqw;border-radius:50%;background:#bdbdbd;border:.6cqw solid #101012;transition:box-shadow .2s,background .2s}
.body{position:absolute;left:50%;top:6.5cqw;width:9cqw;height:11cqw;margin-left:-4.5cqw;border-radius:4.5cqw 4.5cqw 1.5cqw 1.5cqw;background:#9a9a9a;border:.6cqw solid #101012;transition:height .4s}
.stand .body{height:9cqw}
.arm{position:absolute;top:9cqw;width:7cqw;height:2.6cqw;border-radius:2cqw;background:#bdbdbd;border:.6cqw solid #101012}
.p.L .arm{left:50%}.p.R .arm{right:50%}.p.H .arm,.p.F .arm,.stand .arm{display:none}
.legs{position:absolute;left:50%;top:15cqw;width:6cqw;margin-left:-3cqw;height:5.5cqw;display:flex;justify-content:space-between;opacity:0;transition:opacity .3s}
.legs i{width:2.4cqw;height:100%;background:#9a9a9a;border:.5cqw solid #101012;border-radius:1cqw;transform-origin:50% 0}
.stand .legs{opacity:1}
.walk .legs i:first-child{animation:st .38s infinite alternate ease-in-out}
.walk .legs i:last-child{animation:st .38s infinite alternate-reverse ease-in-out}
@keyframes st{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.walk .head,.walk .body{animation:bob .38s infinite alternate ease-in-out}
@keyframes bob{to{transform:translateY(-.8cqw)}}
.name{position:absolute;top:calc(11.5cqw + 7.5cqw*var(--k));left:-4cqw;right:-4cqw;text-align:center;font-size:clamp(10px,2.6cqw,12px);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:top .4s}
.stand .name{top:calc(11cqw + 10cqw*var(--k))}
.p.me .name{color:var(--glow)}
.p.talk .head{background:#fff;box-shadow:0 0 0 1cqw rgba(255,217,160,.35),0 0 18px 4px rgba(255,217,160,.55)}
.p.muted .head::after{content:"";position:absolute;inset:50% 15%;height:2px;background:#101012;transform:rotate(-30deg)}
.crown{position:absolute;left:50%;top:-3.2cqw;transform:translateX(-50%);font-size:3.4cqw;filter:grayscale(1) brightness(1.6)}
/* ui */
.ui{position:absolute;left:0;right:0;bottom:0;padding:3cqw 4cqw 4cqw;display:none;gap:2cqw;flex-wrap:wrap;justify-content:center;background:linear-gradient(transparent,var(--bg) 40%);z-index:3}
button{font:inherit;font-size:clamp(11px,3cqw,13px);color:var(--ink);background:#14141a;border:1px solid #34343c;border-radius:999px;padding:2.4cqw 4cqw;cursor:pointer}
button:hover{border-color:var(--glow)}button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
button.on{background:var(--ink);color:#0a0a0c;border-color:var(--ink)}
.link{width:100%;text-align:center;color:var(--dim);font-size:clamp(10px,2.6cqw,12px);word-break:break-all}
.gate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw;padding:8cqw;text-align:center;background:rgba(7,7,10,.82);backdrop-filter:blur(3px);z-index:5}
.gate p{margin:0;color:var(--dim);font-size:clamp(11px,3cqw,14px);line-height:1.7;max-width:34ch}
.gate h2{margin:0;font-size:clamp(18px,6cqw,26px);letter-spacing:.06em}
input{font:inherit;background:#101014;color:var(--ink);border:1px solid #34343c;border-radius:8px;padding:3cqw 4cqw;width:min(64cqw,300px);text-align:center}
.g{background:var(--ink);color:#0a0a0c;border-color:var(--ink);font-weight:700}
@media (prefers-reduced-motion:reduce){.candle,.walk .legs i,.walk .head,.walk .body{animation:none}}
[hidden]{display:none!important}
#ol-list{position:absolute;right:4cqw;bottom:26cqw;width:58cqw;max-height:40%;overflow:auto;background:#101014;border:1px solid #34343c;border-radius:12px;padding:2cqw;z-index:4;font-size:clamp(11px,2.8cqw,13px);color:var(--dim)}
.row{display:flex;justify-content:space-between;align-items:center;gap:2cqw;padding:1.2cqw 0}
.row span{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row button{padding:1.4cqw 3cqw}
button:disabled{opacity:.5;cursor:default}
#toast{position:absolute;left:4cqw;right:4cqw;top:2%;display:flex;gap:2cqw;align-items:center;flex-wrap:wrap;justify-content:center;background:#14141a;border:1px solid var(--glow);border-radius:14px;padding:3cqw;z-index:7;font-size:clamp(11px,3cqw,13px)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="lamp"></div><div class="cone"></div><div class="shade"></div>
  <h1 id="title">BİR MASA KUR. SESİN YETER.</h1>
  <div id="sub"></div>
  <div class="table"></div><div class="candle"></div>
  <div id="glasses"></div><div id="chairs"></div><div id="seats"></div>
  <div class="ui" id="ui">
    <div class="link" id="link"></div>
    <button id="mic" class="on">Mikrofon açık</button>
    <button id="copy">Linki kopyala</button>
    <button id="ol">Çevrimiçi (0)</button>
    <button id="leave">Masadan kalk</button>
  </div>
  <div id="ol-list" hidden></div><div id="toast" hidden></div>
  <div class="gate" id="gate">
    <h2 id="gt">Masana otur</h2>
    <p id="gp">Masayı kur, linki arkadaşlarına gönder. Linke tıklayan herkes masaya yürüyüp oturur, sen başköşede kalırsın.</p>
    <button class="g" id="go">Google ile devam et</button>
  </div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getDatabase,ref,set,remove,push,onValue,onChildAdded,onDisconnect,runTransaction} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

// ===== BURAYI DOLDUR: Firebase Console > Proje ayarları > Web uygulaması > firebaseConfig =====
const firebaseConfig={apiKey:"AIzaSyCUZpGWJJrTsTOJ6yI9szXh6yadVycY7yc",authDomain:"masa-5d0bd.firebaseapp.com",databaseURL:"https://masa-5d0bd-default-rtdb.firebaseio.com",projectId:"masa-5d0bd",appId:"1:152797830336:web:652e7dd582fe857b12e125"};
// ================================================================================================

const $=i=>document.getElementById(i);
const mk=cl=>{const d=document.createElement('div');d.className=cl;return d};
const TOP=26,H=42,half=y=>7+15*(y-TOP)/H,K=y=>.6+(y-24)*.0105;
const S=[{x:50,y:24,c:'H'}];
[33,42,51,60].forEach(y=>{const o=half(y)+6*K(y);S.push({x:50-o,y,c:'L'},{x:50+o,y,c:'R'})});
S.push({x:50,y:71,c:'F'});
S.forEach((s,i)=>{
  s.k=K(s.y);s.dir=s.c==='R'?1:-1;
  s.spot=(s.c==='H'||s.c==='F')?50-16*s.k:s.x+s.dir*14*s.k;
  s.out=s.c==='R'?110:-10;
  const c=mk('chair '+s.c);c.style.left=s.x+'%';c.style.top=s.y+'%';c.style.setProperty('--k',s.k);
  $('chairs').appendChild(c);s.ch=c;
  if(i>0&&i<9){const g=mk('glass');g.style.left=(50+(s.c==='L'?-1:1)*(half(s.y)-3.5))+'%';g.style.top=(s.y+1)+'%';g.style.setProperty('--k',s.k);$('glasses').appendChild(g)}
});

/* ---------- sahne: otur / kalk ---------- */
const occ=[],P={};
function seat(sid,name,idx,o){
  const s=S[idx],el=mk('p '+s.c+(o.me?' me':''));
  el.style.setProperty('--k',s.k);el.style.top=s.y+'%';
  el.innerHTML='<div class="fig">'+(idx===0?'<div class="crown">♛</div>':'')+'<div class="body"></div><div class="arm"></div><div class="legs"><i></i><i></i></div><div class="head"></div></div><div class="name"></div>';
  el.querySelector('.name').textContent=name+(o.me?' (sen)':'');
  const p={el,sid,name,i:idx,gone:false};occ[idx]=p;P[sid]=p;
  if(o.instant){el.style.left=s.x+'%';$('seats').appendChild(el)}
  else{
    el.classList.add('stand','walk');el.style.left=s.out+'%';$('seats').appendChild(el);
    s.ch.classList.add('out');void el.offsetWidth;el.style.left=s.spot+'%';
    setTimeout(()=>{if(p.gone)return;el.classList.remove('walk','stand');el.style.left=s.x+'%';
      setTimeout(()=>{if(!p.gone)s.ch.classList.remove('out')},350)},1850);
  }
  status();return p;
}
function unseat(p){
  const s=S[p.i];if(occ[p.i]===p)occ[p.i]=null;delete P[p.sid];p.gone=true;
  const el=p.el;el.classList.remove('talk');s.ch.classList.add('out');
  el.classList.remove('walk');el.classList.add('stand');el.style.left=s.spot+'%';
  setTimeout(()=>{el.classList.add('walk');el.style.left=s.out+'%'},650);
  setTimeout(()=>el.remove(),2600);status();
}
function status(){
  const n=Object.keys(P).length;$('sub').style.display='block';
  $('sub').textContent=n+' / 10 kişi masada';
  $('title').textContent=n<10?'MASA KURULDU. '+(10-n)+' SANDALYE BOŞ.':'MASA DOLDU.';
}
function gate(t,p,b,show=true){$('gt').textContent=t;$('gp').textContent=p;$('go').textContent=b;$('gate').style.display=show?'flex':'none';$('ui').style.display=show?'none':'flex'}

/* ---------- ses seviyesi (konuşan kişinin başı parlar) ---------- */
let ctx,meters={};
function meter(stream,id){
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();
  const an=ctx.createAnalyser();an.fftSize=512;ctx.createMediaStreamSource(stream).connect(an);
  meters[id]={an,buf:new Uint8Array(512)};
}
let micOn=true,localStream=null,sid,room=null;
(function loop(){
  for(const id in meters){const m=meters[id];m.an.getByteTimeDomainData(m.buf);let x=0;for(const v of m.buf)x=Math.max(x,Math.abs(v-128));
    const p=P[id];if(p)p.el.classList.toggle('talk',x>14&&(id!==sid||micOn))}
  requestAnimationFrame(loop);
})();

/* ---------- Firebase ---------- */
let app,auth,db,user,myName='Misafir',first=true,unsubs=[],pcs={},online={};
const boot=()=>{
  if(firebaseConfig.apiKey==='BURAYA'){gate('Firebase ayarı eksik','index.html içindeki firebaseConfig alanını kendi projenin bilgileriyle doldur.','—');return}
  app=initializeApp(firebaseConfig);auth=getAuth(app);db=getDatabase(app);
  if(location.hash)gate('Masaya davetlisin','Google ile giriş yap, masaya yürü, otur.','Google ile devam et');
  onAuthStateChanged(auth,u=>{
    user=u;if(!u)return;
    myName=(u.displayName||'Misafir').split(' ')[0].slice(0,14);
    sid=u.uid.slice(0,6)+Math.random().toString(36).slice(2,6);
    const pr=ref(db,'online/'+sid);set(pr,{uid:u.uid,name:myName,room:null});onDisconnect(pr).remove();
    onValue(ref(db,'online'),sn=>{online=sn.val()||{};renderOnline()});
    onChildAdded(ref(db,'invites/'+sid),sn=>{const v=sn.val();remove(sn.ref);if(v)toast(v)});
    join();
  });
};
$('go').onclick=async()=>{
  if(!db)return;
  if(!user){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('gp').textContent='Giriş hatası: '+(e.code||e.message)}}
  else join();
};

async function join(){
  if(room)return;
  room=(location.hash||'').slice(1)||('masa-'+Math.random().toString(36).slice(2,7));
  history.replaceState(null,'','#'+room);first=true;
  let idx=-1;
  for(let n=0;n<10&&idx<0;n++){
    const r=await runTransaction(ref(db,`rooms/${room}/seats/${n}`),c=>c===null?sid:undefined);
    if(r.committed)idx=n;
  }
  if(idx<0){room=null;gate('Masa dolu','Bu masada boş sandalye kalmadı.','Yeni masa kur');history.replaceState(null,'',location.pathname);return}
  const sr=ref(db,`rooms/${room}/seats/${idx}`),mr=ref(db,`rooms/${room}/members/${sid}`);
  onDisconnect(sr).remove();onDisconnect(mr).remove();
  await set(mr,{name:myName,seat:idx,muted:false});
  set(ref(db,`online/${sid}/room`),room);
  gate('','','',false);$('link').textContent=location.href.split('#')[0]+'#'+room;
  document.title='Masa · '+room;micOn=true;$('mic').className='on';$('mic').textContent='Mikrofon açık';
  try{localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});meter(localStream,sid)}
  catch(e){localStream=null;$('mic').textContent='Mikrofon izni yok'}
  const R=room;
  unsubs.push(onChildAdded(ref(db,`signals/${R}/${sid}`),sn=>{const v=sn.val();remove(sn.ref);if(v)handle(v)}));
  unsubs.push(onValue(ref(db,`rooms/${R}/members`),sn=>{
    if(room!==R)return;
    const m=sn.val()||{};
    for(const id in m)if(!P[id]){
      seat(id,m[id].name,m[id].seat,{me:id===sid,instant:first&&id!==sid});
      if(first&&id!==sid)call(id);       // yeni gelen, masadakilere teklif gönderir
    }
    for(const id in P)if(!m[id]){unseat(P[id]);closePeer(id)}
    for(const id in P)P[id].el.classList.toggle('muted',!!(m[id]&&m[id].muted));
    first=false;
  }));
}
async function leave(quiet){
  if(!room)return;
  const r=room,m=P[sid];room=null;
  unsubs.forEach(f=>f());unsubs=[];Object.keys(pcs).forEach(closePeer);
  if(localStream)localStream.getTracks().forEach(t=>t.stop());localStream=null;meters={};
  const mr=ref(db,`rooms/${r}/members/${sid}`),sr=ref(db,`rooms/${r}/seats/${m.i}`);
  onDisconnect(mr).cancel();onDisconnect(sr).cancel();remove(mr);remove(sr);
  set(ref(db,`online/${sid}/room`),null);
  Object.values(P).forEach(p=>{if(p.sid!==sid||quiet){p.el.remove();p.gone=true;occ[p.i]=null;delete P[p.sid]}});
  if(!quiet){unseat(m);setTimeout(()=>gate('Masadan kalktın','İstersen yeniden gel, sandalyen seni bekliyor.','Masaya otur'),2400)}
  status();
}
$('leave').onclick=()=>leave();

/* ---------- WebRTC (ses) — sinyalleşme Firebase üzerinden ---------- */
const send=(to,type,data)=>push(ref(db,`signals/${room}/${to}`),{from:sid,type,data:JSON.stringify(data)});
function peer(id,late){
  if(pcs[id])return pcs[id];
  const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.q=[];
  if(!late){if(localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));else pc.addTransceiver('audio',{direction:'recvonly'})}
  pc.onicecandidate=e=>{if(e.candidate)send(id,'ice',e.candidate.toJSON())};
  pc.ontrack=e=>{
    let a=$('a_'+id);if(!a){a=document.createElement('audio');a.id='a_'+id;a.autoplay=true;document.body.appendChild(a)}
    a.srcObject=e.streams[0];meter(e.streams[0],id);
  };
  return pcs[id]=pc;
}
async function call(id){
  const pc=peer(id);await pc.setLocalDescription(await pc.createOffer());
  send(id,'offer',{type:pc.localDescription.type,sdp:pc.localDescription.sdp});
}
async function handle(v){
  const d=JSON.parse(v.data);
  if(v.type==='offer'){
    const pc=peer(v.from,true);await pc.setRemoteDescription(d);
    if(localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
    for(const c of pc.q.splice(0))await pc.addIceCandidate(c);
    await pc.setLocalDescription(await pc.createAnswer());
    send(v.from,'answer',{type:pc.localDescription.type,sdp:pc.localDescription.sdp});
  }else{
    const pc=pcs[v.from];if(!pc)return;
    if(v.type==='answer'){await pc.setRemoteDescription(d);for(const c of pc.q.splice(0))await pc.addIceCandidate(c)}
    else if(pc.remoteDescription)await pc.addIceCandidate(d);else pc.q.push(d);
  }
}
function closePeer(id){
  if(pcs[id]){pcs[id].close();delete pcs[id]}
  const a=$('a_'+id);if(a)a.remove();delete meters[id];
}

/* ---------- çevrimiçi listesi ve davet ---------- */
function renderOnline(){
  const ids=Object.keys(online).filter(k=>k!==sid),L=$('ol-list');
  $('ol').textContent='Çevrimiçi ('+ids.length+')';L.textContent='';
  if(!ids.length){L.textContent='Şu an başka kimse çevrimiçi değil.';return}
  ids.forEach(id=>{
    const v=online[id],r=mk('row'),n=document.createElement('span'),b=document.createElement('button'),same=room&&v.room===room;
    n.textContent=v.name+(same?' · masanda':v.room?' · başka masada':'');
    b.textContent=same?'Masanda':'Çağır';b.disabled=!!same||!room;
    b.onclick=()=>{push(ref(db,'invites/'+id),{from:sid,name:myName,room});b.textContent='Gönderildi';b.disabled=true};
    r.append(n,b);L.append(r);
  });
}
function toast(v){
  const T=$('toast'),s=document.createElement('span'),a=document.createElement('button'),b=document.createElement('button');
  T.textContent='';s.textContent=v.name+' seni masasına çağırıyor';a.textContent='Otur';a.className='g';b.textContent='Yok say';
  a.onclick=async()=>{T.hidden=true;if(room)await leave(true);history.replaceState(null,'','#'+v.room);join()};
  b.onclick=()=>{T.hidden=true};T.append(s,a,b);T.hidden=false;
}
$('ol').onclick=()=>{$('ol-list').hidden=!$('ol-list').hidden};

/* ---------- mikrofon / link ---------- */
$('mic').onclick=()=>{
  micOn=!micOn;$('mic').className=micOn?'on':'';$('mic').textContent=micOn?'Mikrofon açık':'Mikrofon kapalı';
  if(localStream)localStream.getAudioTracks().forEach(t=>t.enabled=micOn);
  if(room)set(ref(db,`rooms/${room}/members/${sid}/muted`),!micOn);
};
$('copy').onclick=()=>{
  try{navigator.clipboard.writeText($('link').textContent).then(()=>{$('copy').textContent='Kopyalandı'})}catch(e){$('copy').textContent='Linki elle kopyala'}
  setTimeout(()=>{$('copy').textContent='Linki kopyala'},1600);
};
boot();
</script>
</body>
